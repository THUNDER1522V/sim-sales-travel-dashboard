<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Travel SIM Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Chart JS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">
            🌍 Travel SIM
        </div>

        <ul>

            <li class="active">
                <i class="fa-solid fa-chart-line"></i>
                Dashboard
            </li>

            <li>
                <i class="fa-solid fa-users"></i>
                Users
            </li>

            <li>
                <i class="fa-solid fa-sim-card"></i>
                Products
            </li>

            <li>
                <i class="fa-solid fa-cart-shopping"></i>
                Orders
            </li>

        </ul>

    </aside>



    <!-- Main Content -->

    <main class="main">

        <header>

            <h1>Travel SIM Sales Dashboard</h1>

            <div class="profile">
                Admin
            </div>

        </header>



        <!-- KPI Cards -->

        <section class="cards">

            <div class="card">

                <h4>Total Revenue</h4>

                <h2 id="revenue">₹0</h2>

            </div>

            <div class="card">

                <h4>Total Orders</h4>

                <h2 id="orders">0</h2>

            </div>

            <div class="card">

                <h4>Total Users</h4>

                <h2 id="customers">0</h2>

            </div>

            <div class="card">

                <h4>Average Order Value</h4>

                <h2 id="average">₹0</h2>

            </div>

        </section>



        <!-- Charts -->

        <section class="charts">

            <div class="chart-card">

                <h3>Monthly Revenue</h3>

                <canvas id="revenueChart"></canvas>

            </div>

            <div class="chart-card">

                <h3>Country Wise Sales</h3>

                <canvas id="countryChart"></canvas>

            </div>

        </section>



        <!-- Recent Orders -->

        <section class="table-card">

            <h3>Recent Orders</h3>

            <table>

                <thead>

                    <tr>

                        <th>Order No</th>

                        <th>Customer</th>

                        <th>Product</th>

                        <th>Country</th>

                        <th>Amount</th>

                        <th>Date</th>

                    </tr>

                </thead>

                <tbody id="ordersTable">

                </tbody>

            </table>

        </section>

    </main>


    <script src="config.js"></script>
    <script src="script.js"></script>

</body>

</html>
